# Local or VPS run:  cp .env.example .env  (fill the secrets)  then  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kawrexam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kawrexam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawrexam -d kawrexam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://kawrexam:${POSTGRES_PASSWORD}@db:5432/kawrexam
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CODE_HASH_PEPPER: ${CODE_HASH_PEPPER:?Set CODE_HASH_PEPPER in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEV_EMAIL: ${DEV_EMAIL:-}
      DEV_NAME: ${DEV_NAME:-}
      DEV_PASSWORD: ${DEV_PASSWORD:-}
    ports:
      - "3000:3000"

  console:
    build:
      context: ./developer-console
      args:
        BACKEND_URL: http://backend:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  pgdata:
